<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Aptitude Evaluation System</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Brand colours taken from the DAES logo. */
    :root { --brand: #1f4fa8; --brand-dark: #173d86; --accent: #2bb3b1; }

    .page-bg {
      background:
        radial-gradient(60rem 30rem at 50% -10%, rgba(31,79,168,.08), transparent 70%),
        radial-gradient(40rem 20rem at 100% 100%, rgba(43,179,177,.07), transparent 70%),
        #f8fafc;
    }
    .access-card {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 1.25rem;
      box-shadow: 0 1px 2px rgba(15,23,42,.04), 0 12px 32px -12px rgba(15,23,42,.12);
    }
    /* ── Passcode field ──────────────────────────────────────
       One real <input> (so paste, autofill and screen readers work) sits
       invisibly on top of 8 character slots that display what was typed.
       Codes are always "DAES-" + 8 hex characters, so the prefix is fixed. */
    .code-label {
      display: flex; align-items: center; justify-content: center; gap: .5rem;
      font-size: .8rem; font-weight: 600; color: #64748b; margin-bottom: .75rem;
    }
    .code-prefix {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-weight: 800; letter-spacing: .08em; font-size: .8rem;
      color: var(--brand); background: rgba(31,79,168,.08);
      border: 1px solid rgba(31,79,168,.16);
      padding: .2rem .55rem; border-radius: .5rem;
    }
    .code-slots {
      position: relative;
      display: grid; align-items: center;
      grid-template-columns: repeat(4, minmax(0, 1fr)) .8rem repeat(4, minmax(0, 1fr));
      gap: .4rem;
    }
    .slot {
      aspect-ratio: 4 / 5; max-height: 3.4rem;
      display: grid; place-items: center; position: relative;
      border: 1.5px solid #e2e8f0; border-radius: .7rem; background: #f8fafc;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: clamp(1rem, 4.5vw, 1.3rem); font-weight: 800; color: #0f172a;
      transition: border-color .15s, background .15s, box-shadow .15s, transform .15s;
    }
    .slot.filled { background: #fff; border-color: rgba(31,79,168,.35); }
    .slot.filled.pop { animation: slotPop .18s ease-out; }
    @keyframes slotPop { 50% { transform: scale(1.08); } }
    .slot-sep { text-align: center; color: #cbd5e1; font-weight: 800; }
    .code-field.is-focused .slot.active {
      border-color: var(--brand); background: #fff;
      box-shadow: 0 0 0 4px rgba(31,79,168,.12);
    }
    /* Blinking caret in the active empty slot. */
    .code-field.is-focused .slot.active:not(.filled)::after {
      content: ''; width: 2px; height: 45%; border-radius: 2px;
      background: var(--brand); animation: caretBlink 1s steps(1) infinite;
    }
    @keyframes caretBlink { 50% { opacity: 0; } }
    .code-field.is-complete .slot { border-color: var(--accent); }
    .code-field.field-error .slot { border-color: #dc2626; background: #fef2f2; }
    /* The slots show the error; no ring around the whole block. */
    .code-field.field-error { box-shadow: none !important; }

    #code {
      position: absolute; inset: 0; width: 100%; height: 100%;
      border: 0; outline: none; background: transparent;
      color: transparent; caret-color: transparent;
      font-size: 16px; /* >= 16px stops iOS zooming in on focus */
      letter-spacing: 1em; cursor: text;
    }
    #code::selection { background: transparent; }
    .code-hint { margin-top: .7rem; text-align: center; font-size: .74rem; font-weight: 500; color: #94a3b8; }

    .btn-primary {
      width: 100%;
      display: flex; align-items: center; justify-content: center; gap: .5rem;
      padding: .9rem 1rem; border-radius: .75rem;
      background: var(--brand); color: #fff;
      font-weight: 700; font-size: .95rem;
      transition: background .15s, transform .05s;
    }
    .btn-primary:hover  { background: var(--brand-dark); }
    .btn-primary:active { transform: translateY(1px); }
    .btn-primary:focus-visible { outline: none; box-shadow: 0 0 0 4px rgba(31,79,168,.25); }
  </style>
  <!-- Pre-built Tailwind utilities (see tailwind.config.js). Kept last in <head>
       so it overrides page styles the same way the former Tailwind CDN did. -->
  <link rel="stylesheet" href="css/tailwind.css">
</head>

<body class="page-bg min-h-screen text-slate-900">
<div class="min-h-screen flex flex-col">

  <!-- Top bar -->
  <header class="w-full max-w-6xl mx-auto flex items-center justify-end px-5 sm:px-8 py-5">
    <a href="admin-login.html"
       class="inline-flex items-center gap-1.5 text-sm font-semibold text-slate-500 hover:text-[color:var(--brand)] transition-colors">
      <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
        <circle cx="12" cy="7" r="4"/>
      </svg>
      Admin login
    </a>
  </header>

  <!-- Access card -->
  <main class="flex-1 flex items-center justify-center px-4 pb-10">
    <div class="w-full max-w-[26rem]">
      <div class="access-card px-6 py-8 sm:px-10 sm:py-10">

        <img src="assets/logo-web.png" alt="DAES — Digital Aptitude Evaluation System"
             class="h-20 sm:h-24 mx-auto object-contain">

        <div class="text-center mt-8 mb-7">
          <h1 class="text-2xl font-extrabold tracking-tight text-slate-900">Start your assessment</h1>
          <p class="text-sm text-slate-500 mt-2 leading-relaxed">
            Enter the passcode provided by your administrator.
          </p>
        </div>

        <form id="passcodeForm" class="space-y-4">
          <div id="codeField" class="code-field" data-field-frame>
            <label class="code-label" for="code">
              <span class="code-prefix">DAES&ndash;</span>
              <span>followed by 8 characters</span>
            </label>
            <div class="code-slots">
              <span class="slot" data-slot="0" aria-hidden="true"></span>
              <span class="slot" data-slot="1" aria-hidden="true"></span>
              <span class="slot" data-slot="2" aria-hidden="true"></span>
              <span class="slot" data-slot="3" aria-hidden="true"></span>
              <span class="slot-sep" aria-hidden="true">&ndash;</span>
              <span class="slot" data-slot="4" aria-hidden="true"></span>
              <span class="slot" data-slot="5" aria-hidden="true"></span>
              <span class="slot" data-slot="6" aria-hidden="true"></span>
              <span class="slot" data-slot="7" aria-hidden="true"></span>
              <input id="code"
                     aria-label="Passcode: the 8 characters after DAES-"
                     autocomplete="one-time-code"
                     autocapitalize="characters"
                     autocorrect="off"
                     spellcheck="false"
                     aria-describedby="codeHint message"
                     required>
            </div>
            <p id="codeHint" class="code-hint">Numbers 0&ndash;9 and letters A&ndash;F &middot; you can paste the full code</p>
          </div>

          <button class="btn-primary" type="submit">
            Continue
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 12h14"/><path d="M12 5l7 7-7 7"/>
            </svg>
          </button>
        </form>

        <!-- Inline message (success / error) -->
        <p id="message" class="mt-3" role="alert" aria-live="assertive"></p>
      </div>

      <!-- Trust row -->
      <ul class="mt-6 flex flex-wrap items-center justify-center gap-x-5 gap-y-2 text-xs font-medium text-slate-500">
        <li class="inline-flex items-center gap-1.5">
          <svg class="w-3.5 h-3.5 text-[color:var(--accent)]" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
          Secure &amp; proctored
        </li>
        <li class="inline-flex items-center gap-1.5">
          <svg class="w-3.5 h-3.5 text-[color:var(--accent)]" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
          </svg>
          Timed
        </li>
        <li class="inline-flex items-center gap-1.5">
          <svg class="w-3.5 h-3.5 text-[color:var(--accent)]" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
          Auto-scored
        </li>
      </ul>
    </div>
  </main>

  <footer class="text-center text-xs text-slate-400 pb-6 px-4">
    © <span id="cpYear"></span> DHI · All rights reserved
  </footer>

</div>

<script src="js/common.js"></script>
<script src="js/auth.js"></script>
<script>
  // Show "2026" in the first year, "2026–2027" afterwards.
  (function () {
    const start = 2026, now = new Date().getFullYear();
    document.getElementById('cpYear').textContent = now > start ? `${start}–${now}` : `${start}`;
  })();
</script>
</body>
</html>
