<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - DAES</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Brand colours taken from the DAES logo — same as index.html. */
    :root { --brand: #1f4fa8; --brand-dark: #173d86; --accent: #2bb3b1; }

    .page-bg {
      background:
        radial-gradient(60rem 30rem at 50% -10%, rgba(31,79,168,.08), transparent 70%),
        radial-gradient(40rem 20rem at 100% 100%, rgba(43,179,177,.07), transparent 70%),
        #f8fafc;
    }
    .access-card {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 1.25rem;
      box-shadow: 0 1px 2px rgba(15,23,42,.04), 0 12px 32px -12px rgba(15,23,42,.12);
    }
    .field {
      width: 100%;
      padding: .8rem 1rem .8rem 2.6rem;
      border: 1px solid #cbd5e1; border-radius: .75rem;
      background: #fff; color: #0f172a; font-size: .95rem;
      transition: border-color .15s, box-shadow .15s;
    }
    .field::placeholder { color: #94a3b8; }
    .field:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 4px rgba(31,79,168,.12); }

    .btn-primary {
      width: 100%;
      display: flex; align-items: center; justify-content: center; gap: .5rem;
      padding: .9rem 1rem; border-radius: .75rem;
      background: var(--brand); color: #fff;
      font-weight: 700; font-size: .95rem;
      transition: background .15s, transform .05s;
    }
    .btn-primary:hover  { background: var(--brand-dark); }
    .btn-primary:active { transform: translateY(1px); }
    .btn-primary:focus-visible { outline: none; box-shadow: 0 0 0 4px rgba(31,79,168,.25); }
  </style>
  <!-- Pre-built Tailwind utilities (see tailwind.config.js). Kept last in <head>
       so it overrides page styles the same way the former Tailwind CDN did. -->
  <link rel="stylesheet" href="css/tailwind.css">
</head>

<body class="page-bg min-h-screen text-slate-900">
<div class="min-h-screen flex flex-col">

  <!-- Top bar -->
  <header class="w-full max-w-6xl mx-auto flex items-center justify-end px-5 sm:px-8 py-5">
    <a href="index.html"
       class="inline-flex items-center gap-1.5 text-sm font-semibold text-slate-500 hover:text-[color:var(--brand)] transition-colors">
      <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/>
      </svg>
      Participant access
    </a>
  </header>

  <!-- Login card -->
  <main class="flex-1 flex items-center justify-center px-4 pb-10">
    <div class="w-full max-w-[26rem]">
      <div class="access-card px-6 py-8 sm:px-10 sm:py-10">

        <img src="assets/logo-web.png" alt="DAES — Digital Aptitude Evaluation System"
             class="h-20 sm:h-24 mx-auto object-contain">

        <div class="text-center mt-8 mb-7">
          <h1 class="text-2xl font-extrabold tracking-tight text-slate-900">Admin sign in</h1>
          <p class="text-sm text-slate-500 mt-2 leading-relaxed">
            Sign in to manage tests, participants and results.
          </p>
        </div>

        <form id="adminLoginForm" class="space-y-4">
          <div>
            <label class="block mb-1.5 text-sm font-semibold text-slate-700" for="username">Username</label>
            <div class="relative">
              <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                  <circle cx="12" cy="7" r="4"/>
                </svg>
              </span>
              <input id="username" class="field"
                     placeholder="Enter your username"
                     autocomplete="username" autocapitalize="none" spellcheck="false" required>
            </div>
          </div>

          <div>
            <label class="block mb-1.5 text-sm font-semibold text-slate-700" for="password">Password</label>
            <div class="relative">
              <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="11" width="18" height="11" rx="2"/>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
              </span>
              <input id="password" type="password" class="field" style="padding-right:2.8rem"
                     placeholder="Enter your password"
                     autocomplete="current-password" required>
              <button type="button" id="togglePassword"
                      class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 transition-colors"
                      aria-label="Toggle password visibility">
                <!-- Eye icon (shown when password is hidden) -->
                <svg id="eyeIcon" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
                <!-- Eye-off icon (shown when password is visible) -->
                <svg id="eyeOffIcon" class="w-4 h-4 hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                  <line x1="1" y1="1" x2="23" y2="23"/>
                </svg>
              </button>
            </div>
            <p id="capsLockHint" class="field-hint hidden">Caps Lock is on.</p>
          </div>

          <button class="btn-primary !mt-6" type="submit">
            Sign in
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 12h14"/><path d="M12 5l7 7-7 7"/>
            </svg>
          </button>
        </form>

        <!-- Inline message (error feedback) -->
        <p id="message" class="mt-3" role="alert" aria-live="assertive"></p>
      </div>

      <!-- Security note -->
      <p class="mt-6 flex items-center justify-center gap-1.5 text-xs font-medium text-slate-500 text-center">
        <svg class="w-3.5 h-3.5 flex-shrink-0 text-[color:var(--accent)]" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
        Restricted to authorised administrators
      </p>
    </div>
  </main>

  <footer class="text-center text-xs text-slate-400 pb-6 px-4">
    © <span id="cpYear"></span> OCTO · All rights reserved
  </footer>

</div>

<script src="js/common.js"></script>
<script src="js/admin.js"></script>
<script>
  // Show "2026" in the first year, "2026–2027" afterwards.
  (function () {
    const start = 2026, now = new Date().getFullYear();
    document.getElementById('cpYear').textContent = now > start ? `${start}–${now}` : `${start}`;
  })();

  document.getElementById('togglePassword').addEventListener('click', function () {
    const input      = document.getElementById('password');
    const eyeIcon    = document.getElementById('eyeIcon');
    const eyeOffIcon = document.getElementById('eyeOffIcon');
    const isHidden   = input.type === 'password';
    input.type       = isHidden ? 'text' : 'password';
    eyeIcon.classList.toggle('hidden', isHidden);
    eyeOffIcon.classList.toggle('hidden', !isHidden);
  });
</script>
</body>
</html>
